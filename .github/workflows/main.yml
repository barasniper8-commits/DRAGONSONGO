
name: "RDP MILIK ARIANTO | CYBERPUNK PRO"

on:
  workflow_dispatch:
    inputs:
      pass_code:
        description: "Masukkan Pass Kode"
        required: true
        type: string
      input_user:
        description: "Masukkan Username RDP"
        required: true
        type: string
      input_password:
        description: "Masukkan Password RDP"
        required: true
        type: string
      tailscale_key:
        description: "Masukkan Tailscale Auth Key"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: "ARIANTO RDP CYBERPUNK"
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: "INITIALIZE CYBERPUNK TERMINAL"
        shell: pwsh
        run: |
          $Host.UI.RawUI.WindowTitle = "ARIANTO RDP CYBERPUNK PRO"
          $Host.UI.RawUI.ForegroundColor = "Cyan"
          Clear-Host

          Write-Host ""
          Write-Host "========================================================" -ForegroundColor Cyan
          Write-Host "    █████╗ ██████╗ ██╗ █████╗ ███╗   ██╗████████╗ ██████╗" -ForegroundColor Magenta
          Write-Host "   ██╔══██╗██╔══██╗██║██╔══██╗████╗  ██║╚══██╔══╝██╔═══██╗" -ForegroundColor Magenta
          Write-Host "   ███████║██████╔╝██║███████║██╔██╗ ██║   ██║   ██║   ██║" -ForegroundColor Cyan
          Write-Host "   ██╔══██║██╔══██╗██║██╔══██║██║╚██╗██║   ██║   ██║   ██║" -ForegroundColor Cyan
          Write-Host "   ██║  ██║██║  ██║██║██║  ██║██║ ╚████║   ██║   ╚██████╔╝" -ForegroundColor Magenta
          Write-Host "========================================================" -ForegroundColor Cyan
          Write-Host "       RDP MILIK ARIANTO | WINDOWS CLOUD SYSTEM" -ForegroundColor Green
          Write-Host "       CANDIPURO - LUMAJANG - JAWA TIMUR" -ForegroundColor Yellow
          Write-Host "       CYBERPUNK CORE INITIALIZING..." -ForegroundColor Cyan
          Write-Host "========================================================" -ForegroundColor Cyan
          Write-Host ""

          $tasks = @(
            "Initializing cyberpunk terminal",
            "Loading Windows cloud environment",
            "Preparing network interface",
            "Initializing remote access module",
            "Preparing system diagnostics"
          )

          foreach ($task in $tasks) {
            Write-Host "[SYSTEM] $task" -ForegroundColor Cyan
            foreach ($i in 1..20) {
              $bar = ("#" * $i).PadRight(20, "-")
              Write-Host "`r[$bar] $($i * 5)%" -NoNewline -ForegroundColor Magenta
              Start-Sleep -Milliseconds 35
            }
            Write-Host ""
            Write-Host "[OK] $task" -ForegroundColor Green
          }

          Write-Host ""
          Write-Host "[READY] CYBERPUNK TERMINAL INITIALIZED" -ForegroundColor Green

      - name: "CHECKOUT REPOSITORY"
        uses: actions/checkout@v4

      - name: "FETCH WEB CREDENTIAL REGISTRY"
        id: fetch-cred
        shell: pwsh
        env:
          PASS_CODE_INPUT: ${{ inputs.pass_code }}
          USER_INPUT: ${{ inputs.input_user }}
          PASSWORD_INPUT: ${{ inputs.input_password }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "[01/06] CONNECTING TO CREDENTIAL REGISTRY..." -ForegroundColor Cyan

          $targetUrl = "https://arianto12.lynk.id/p/ganjay"

          try {
            $response = Invoke-WebRequest `
              -Uri $targetUrl `
              -Headers @{ "User-Agent" = "Mozilla/5.0" } `
              -UseBasicParsing `
              -TimeoutSec 20

            $content = $response.Content

            $passMatch = [regex]::Match(
              $content, '(?im)passcode\s*:\s*([^\r\n<]+)'
            )
            $userMatch = [regex]::Match(
              $content, '(?im)user\s*:\s*([^\r\n<]+)'
            )
            $passwordMatch = [regex]::Match(
              $content, '(?im)password\s*:\s*([^\r\n<]+)'
            )

            if (-not $passMatch.Success -or
                -not $userMatch.Success -or
                -not $passwordMatch.Success) {
              throw "Required credential fields were not found."
            }

            $passCodes = @(
              $passMatch.Groups[1].Value -split ',' |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ }
            )

            $users = @(
              $userMatch.Groups[1].Value -split ',' |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ }
            )

            $passwords = @(
              $passwordMatch.Groups[1].Value -split ',' |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ }
            )

            if ($passCodes.Count -eq 0 -or
                $users.Count -eq 0 -or
                $passwords.Count -eq 0) {
              throw "Credential registry is empty."
            }

            $user = $env:USER_INPUT.Trim()
            $password = $env:PASSWORD_INPUT.Trim()
            $passCode = $env:PASS_CODE_INPUT.Trim()

            foreach ($secret in @($passCodes) + @($users) + @($passwords)) {
              if ($secret) {
                Write-Output "::add-mask::$secret"
              }
            }

            if ($password) {
              Write-Output "::add-mask::$password"
            }

            if ($passCode) {
              Write-Output "::add-mask::$passCode"
            }

            if ($passCodes -cnotcontains $passCode) {
              throw "Passcode verification failed."
            }

            if ($users -cnotcontains $user) {
              throw "Username verification failed."
            }

            if ($passwords -cnotcontains $password) {
              throw "Password verification failed."
            }

            "verified_user=$user" >> $env:GITHUB_OUTPUT
            "verified_password=$password" >> $env:GITHUB_OUTPUT

            Write-Host "[OK] REGISTRY VALIDATED" -ForegroundColor Green
            Write-Host "[OK] PASSCODE ACCEPTED" -ForegroundColor Green
            Write-Host "[OK] USER CREDENTIALS ACCEPTED" -ForegroundColor Green
          }
          catch {
            Write-Host "[ERROR] REGISTRY VALIDATION FAILED" -ForegroundColor Red
            throw "Credential validation failed. Check the webpage format and supplied credentials."
          }

      - name: "WINDOWS CYBERPUNK LOADING DISPLAY"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "[02/06] WINDOWS CLOUD INITIALIZATION" -ForegroundColor Cyan

          $tasks = @(
            "Checking Windows runtime",
            "Preparing system configuration",
            "Loading network components",
            "Preparing remote desktop environment"
          )

          foreach ($task in $tasks) {
            Write-Host ""
            Write-Host ">> $task" -ForegroundColor Magenta
            for ($i = 0; $i -le 100; $i += 10) {
              $bar = ("=" * ($i / 5)).PadRight(20, ".")
              Write-Host "`r[$bar] $i%" -NoNewline -ForegroundColor Cyan
              Start-Sleep -Milliseconds 100
            }
            Write-Host ""
            Write-Host "[OK] $task" -ForegroundColor Green
          }

          Write-Host "[OK] DISPLAY SEQUENCE COMPLETE" -ForegroundColor Green

      - name: "CREATE RDP USER"
        shell: pwsh
        env:
          RDP_USER: ${{ steps.fetch-cred.outputs.verified_user }}
          RDP_PASSWORD: ${{ steps.fetch-cred.outputs.verified_password }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "[03/06] CONFIGURING RDP ACCOUNT..." -ForegroundColor Cyan

          $user = $env:RDP_USER
          $password = $env:RDP_PASSWORD

          if ([string]::IsNullOrWhiteSpace($user) -or
              [string]::IsNullOrWhiteSpace($password)) {
            throw "Missing validated account information."
          }

          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force

          $account = Get-LocalUser -Name $user -ErrorAction SilentlyContinue

          if ($account) {
            Set-LocalUser -Name $user -Password $securePassword
          }
          else {
            New-LocalUser `
              -Name $user `
              -Password $securePassword `
              -PasswordNeverExpires `
              -AccountNeverExpires | Out-Null
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $user `
            -ErrorAction SilentlyContinue

          Write-Host "[OK] RDP ACCOUNT CONFIGURED" -ForegroundColor Green

      - name: "INSTALL AND CONNECT TAILSCALE"
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ inputs.tailscale_key }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "[04/06] TAILSCALE NETWORK INITIALIZATION" -ForegroundColor Cyan

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "Tailscale authentication key is missing."
          }

          Write-Output "::add-mask::$env:TS_AUTHKEY"

          $installer = Join-Path $env:TEMP "tailscale-setup.msi"

          Write-Host "[LOAD] Downloading Tailscale..." -ForegroundColor Magenta

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $installer `
            -TimeoutSec 120

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait `
            -PassThru

          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Tailscale installation failed."
          }

          $tailscalePath = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscalePath)) {
            throw "Tailscale executable not found."
          }

          Write-Host "[LOAD] Connecting secure network..." -ForegroundColor Magenta

          & $tailscalePath up "--authkey=$env:TS_AUTHKEY" --accept-routes

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          Write-Host "[OK] TAILSCALE CONNECTED" -ForegroundColor Green

          Remove-Item $installer -Force -ErrorAction SilentlyContinue

      - name: "ENABLE REMOTE DESKTOP"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "[05/06] ENABLING REMOTE DESKTOP SERVICES" -ForegroundColor Cyan

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Write-Host "[OK] REMOTE DESKTOP CONFIGURED" -ForegroundColor Green

      - name: "FINAL SYSTEM STATUS"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================================" -ForegroundColor Cyan
          Write-Host "            RDP MILIK ARIANTO" -ForegroundColor Magenta
          Write-Host "      CANDIPURO - LUMAJANG - JAWA TIMUR" -ForegroundColor Yellow
          Write-Host "========================================================" -ForegroundColor Cyan
          Write-Host "[OK] WINDOWS RUNTIME READY" -ForegroundColor Green
          Write-Host "[OK] CREDENTIAL VALIDATION COMPLETED" -ForegroundColor Green
          Write-Host "[OK] TAILSCALE CONNECTION COMPLETED" -ForegroundColor Green
          Write-Host "[OK] RDP CONFIGURATION COMPLETED" -ForegroundColor Green
          Write-Host ""
          Write-Host "[INFO] GitHub-hosted runners are temporary." -ForegroundColor Yellow
          Write-Host "[INFO] This workflow cannot keep a hosted runner alive indefinitely." -ForegroundColor Yellow
          Write-Host "========================================================" -ForegroundColor Cyan
