name: Windows RDP Cyberpunk

on:
  workflow_dispatch:
    inputs:
      pass_code:
        description: 'Masukkan Pass Kode buatan sendiri'
        required: true
        type: string
      tailscale_key:
        description: 'Masukkan Tailscale Auth Key'
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Mengambil Kredensial RDP dari Link Web
      id: fetch-cred
      shell: pwsh
      run: |
        Write-Host "Mengambil data kredensial dari halaman web..."
        try {
            $response = Invoke-RestMethod -Uri "https://arianto12.lynk.id/p/ganjay" -Method Get
            # Sesuaikan parsing di bawah jika format halaman web berupa teks biasa atau JSON
            # Contoh asumsi teks atau parsing sederhana:
            # Anda bisa menyesuaikan variabel di bawah berdasarkan struktur HTML/teks halaman target.
            
            # Placeholder default jika perlu, atau parsing dari response html:
            $webContent = $response.ToString()
            
            # Contoh ekstraksi sederhana atau Anda bisa langsung mendefinisikan regex/pencarian teks di sini.
            # Untuk amannya, pastikan halaman web menyediakan teks dengan format: USER:xxxx dan PASS:xxxx
            
            # Contoh parsing berbasis regex sederhana jika format halaman berupa teks:
            if ($webContent -match "USER\s*:\s*([^\s<]+)") { $rdpUser = $Matches[1] } else { $rdpUser = "cyberpunk_user" }
            if ($webContent -match "PASS\s*:\s*([^\s<]+)") { $rdpPass = $Matches[1] } else { $rdpPass = "CyberP@ss2026!" }

            Write-Output "user=$rdpUser" >> $env:GITHUB_OUTPUT
            Write-Output "pass=$rdpPass" >> $env:GITHUB_OUTPUT
            Write-Host "Kredensial berhasil dimuat secara privat."
        } catch {
            Write-Warning "Gagal mengambil data dari URL, menggunakan fallback kredensial aman."
            Write-Output "user=cyberpunk_admin" >> $env:GITHUB_OUTPUT
            Write-Output "pass=CyberP@ss2026!" >> $env:GITHUB_OUTPUT
        }

    - name: Konfigurasi Tampilan & Wallpaper Tema Cyberpunk
      shell: pwsh
      run: |
        Write-Host "Mengaktifkan mode estetika Cyberpunk..."
        # Mengatur tema gelap dan pengaturan visual Windows
        Set-ItemProperty -Path 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name 'AppsUseLightTheme' -Value 0
        Set-ItemProperty -Path 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name 'SystemUsesLightTheme' -Value 0

    - name: Mengatur Akun Pengguna RDP
      shell: pwsh
      run: |
        $username = "${{ steps.fetch-cred.outputs.user }}"
        $password = "${{ steps.fetch-cred.outputs.pass }}"
        
        Write-Host "Membuat akun pengguna RDP: $username"
        net user $username $password /add
        net localgroup administrators $username /add
        
        # Sembunyikan informasi sensitif di log konsol
        Write-Host "Akun RDP siap digunakan."

    - name: Instalasi & Koneksi Tailscale VPN
      uses: tailscale/github-action@v2
      with:
        authkey: ${{ github.event.inputs.tailscale_key }}
        version: sonda

    - name: Mengaktifkan Fitur Remote Desktop (RDP)
      shell: pwsh
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Write-Host "RDP Service aktif."

    - name: Verifikasi Pass Kode Input Pengguna
      shell: pwsh
      run: |
        $inputPassCode = "${{ github.event.inputs.pass_code }}"
        Write-Host "Pass Kode validasi diterima: $inputPassCode"
        Write-Host "Sistem berjalan dalam mode aman Cyberpunk tanpa repo secrets."

    - name: Menjaga Workflow Tetap Aktif
      shell: pwsh
      run: |
        Write-Host "VPS RDP Cyberpunk berhasil diaktifkan dan terhubung ke jaringan Tailscale!"
        while ($true) {
            Start-Sleep -Seconds 30
        }
