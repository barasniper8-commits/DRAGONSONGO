name: Windows RDP Cyberpunk

on:
  workflow_dispatch:
    inputs:
      pass_code:
        description: 'Masukkan Pass Kode (salah satu dari daftar web)'
        required: true
        type: string
      custom_user:
        description: 'Masukkan Username RDP baru'
        required: true
        type: string
      custom_pass:
        description: 'Masukkan Password RDP baru'
        required: true
        type: string
      tailscale_key:
        description: 'Masukkan Tailscale Auth Key'
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Mengambil & Memvalidasi Multi Pass Kode dari Link Web
      id: fetch-cred
      shell: pwsh
      run: |
        $targetUrl = "https://arianto12.lynk.id/p/ganjay"
        Write-Host "::add-mask::$targetUrl"
        
        Write-Host "Mengambil data pass kode dari halaman web privat..."
        try {
            $headers = @{ "User-Agent" = "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" }
            $response = Invoke-WebRequest -Uri $targetUrl -Headers $headers -UseBasicParsing
            $webContent = $response.Content
            
            # Parsing Multi Passcode dari web
            if ($webContent -match "paskode\s*:\s*([^\r\n<]+)") { 
                $rawPassCodes = $Matches[1]
                $global:validPassCodes = $rawPassCodes -split ',' | ForEach-Object { $_.Trim() }
            } else {
                $global:validPassCodes = @("CyberCyber2026")
            }

            $passCodesString = $global:validPassCodes -join ","
            Write-Output "web_paskodes=$passCodesString" >> $env:GITHUB_OUTPUT
            Write-Host "Data pass kode berhasil dimuat dengan aman."
        } catch {
            Write-Host "Warning: Gagal terhubung, menggunakan pass kode default sistem..."
            Write-Output "web_paskodes=CyberCyber2026,Admin2026" >> $env:GITHUB_OUTPUT
        }

    - name: Konfigurasi Tampilan & Wallpaper Tema Cyberpunk
      shell: pwsh
      run: |
        Write-Host "Mengaktifkan mode estetika Cyberpunk..."
        Set-ItemProperty -Path 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name 'AppsUseLightTheme' -Value 0
        Set-ItemProperty -Path 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name 'SystemUsesLightTheme' -Value 0

    - name: Membuat Akun Pengguna RDP dari Input Workflow
      shell: pwsh
      run: |
        $username = "${{ github.event.inputs.custom_user }}".Trim()
        $password = "${{ github.event.inputs.custom_pass }}".Trim()
        
        # Menyembunyikan password di log konsol GitHub Actions
        Write-Host "::add-mask::$password"
        
        Write-Host "Membuat akun RDP dengan user: $username"
        net user $username $password /add
        net localgroup administrators $username /add
        
        Write-Host "Akun RDP berhasil dibuat dan dijadikan Administrator."

    - name: Instalasi & Koneksi Tailscale VPN (Windows MSI)
      shell: pwsh
      run: |
        Write-Host "Mengunduh Tailscale MSI Installer untuk Windows..."
        $installer = "$env:TEMP\tailscale-setup.msi"
        Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.88.4-amd64.msi" -OutFile $installer
        
        Write-Host "Menginstal Tailscale secara silent..."
        Start-Process msiexec.exe -Wait -ArgumentList "/i $installer /quiet /norestart"
        
        Write-Host "Menghubungkan ke Tailscale..."
        $tailscalePath = "${env:ProgramFiles}\Tailscale\tailscale.exe"
        & $tailscalePath up --authkey="${{ github.event.inputs.tailscale_key }}" --accept-routes
        Write-Host "Tailscale berhasil terhubung!"

    - name: Mengaktifkan Fitur Remote Desktop (RDP)
      shell: pwsh
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Write-Host "RDP Service aktif."

    - name: Verifikasi Multi Pass Kode (Disembunyikan di Log)
      shell: pwsh
      run: |
        $inputPassCode = "${{ github.event.inputs.pass_code }}".Trim()
        $webPassCodesString = "${{ steps.fetch-cred.outputs.web_paskodes }}"
        $validCodes = $webPassCodesString -split ','
        
        Write-Host "::add-mask::$inputPassCode"
        foreach ($code in $validCodes) {
            Write-Host "::add-mask::$code"
        }
        
        Write-Host "Memverifikasi Pass Kode yang dimasukkan..."
        if ($validCodes -contains $inputPassCode) {
            Write-Host "Verifikasi Pass Kode BERHASIL! (Kode valid)"
        } else {
            Write-Error "GAGAL: Pass Kode yang Anda masukkan tidak terdaftar di dalam daftar web! Workflow dihentikan."
            exit 1
        }

    - name: Menjaga Workflow Tetap Aktif
      shell: pwsh
      run: |
        Write-Host "VPS RDP Cyberpunk berhasil diaktifkan dan terhubung ke jaringan Tailscale!"
        while ($true) {
            Start-Sleep -Seconds 30
        }
