name: Windows RDP Cyberpunk

on:
  workflow_dispatch:
    inputs:
      pass_code:
        description: 'Masukkan Pass Kode (salah satu dari web)'
        required: true
        type: string
      input_user:
        description: 'Masukkan Username RDP (salah satu dari web)'
        required: true
        type: string
      input_password:
        description: 'Masukkan Password RDP (sesuai user)'
        required: true
        type: string
      tailscale_key:
        description: 'Masukkan Tailscale Auth Key'
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 150

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Membaca & Memvalidasi Web Lynk.id (Aman & Tanpa Crash)
      id: fetch-cred
      shell: pwsh
      run: |
        $u1 = "https://arianto1"
        $u2 = "2.lynk.id/p/ganjay"
        $targetUrl = "$u1$u2"
        
        [Console]::WriteLine("::add-mask::$targetUrl")
        
        try {
            $headers = @{ "User-Agent" = "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" }
            $response = Invoke-WebRequest -Uri $targetUrl -Headers $headers -UseBasicParsing
            $webContent = $response.Content
            
            $plainText = [System.Text.RegularExpressions.Regex]::Replace($webContent, "<[^>]+>", " ")
            
            $validPassCodes = @()
            $validUsers = @()
            $validPasswords = @()

            if ($plainText -match "passcode\s*[:=]\s*([^\r\n]+)") {
                $validPassCodes = $Matches[1].Trim() -split ',' | ForEach-Object { $_.Trim() }
            }
            if ($plainText -match "user\s*[:=]\s*([^\r\n]+)") {
                $validUsers = $Matches[1].Trim() -split ',' | ForEach-Object { $_.Trim() }
            }
            if ($plainText -match "password\s*[:=]\s*([^\r\n]+)") {
                $validPasswords = $Matches[1].Trim() -split ',' | ForEach-Object { $_.Trim() }
            }

            if ($validPassCodes.Count -eq 0) { $validPassCodes = @($plainText -split '\s+') }
            if ($validUsers.Count -eq 0) { $validUsers = @("${{ github.event.inputs.input_user }}") }
            if ($validPasswords.Count -eq 0) { $validPasswords = @("${{ github.event.inputs.input_password }}") }

            Write-Output "web_paskodes=$($validPassCodes -join ',')" >> $env:GITHUB_OUTPUT
            Write-Output "web_users=$($validUsers -join ',')" >> $env:GITHUB_OUTPUT
            Write-Output "web_passwords=$($validPasswords -join ',')" >> $env:GITHUB_OUTPUT
            
            Write-Host "Status: Data dari Lynk.id berhasil diakses."
        } catch {
            Write-Host "Peringatan: Gagal membaca halaman web, melanjutkan proses dengan input pengguna."
            Write-Output "web_paskodes=bypass" >> $env:GITHUB_OUTPUT
            Write-Output "web_users=${{ github.event.inputs.input_user }}" >> $env:GITHUB_OUTPUT
            Write-Output "web_passwords=${{ github.event.inputs.input_password }}" >> $env:GITHUB_OUTPUT
        }

    - name: Konfigurasi Tampilan Tema Cyberpunk
      shell: pwsh
      run: |
        Set-ItemProperty -Path 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name 'AppsUseLightTheme' -Value 0
        
        Set-ItemProperty -Path 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name 'SystemUsesLightTheme' -Value 0

    - name: Verifikasi & Pembuatan Akun RDP
      shell: pwsh
      run: |
        $inputUser = "${{ github.event.inputs.input_user }}".Trim()
        
        $inputPass = "${{ github.event.inputs.input_password }}".Trim()
        
        Write-Host "::add-mask::$inputPass"

        net user $inputUser $inputPass /add
        
        net localgroup administrators $inputUser /add
        
        Write-Host "Status: Akun RDP '$inputUser' berhasil dibuat dan berstatus Administrator."

    - name: Set Foto Profil & Wallpaper Desktop (Wajib Berhasil)
      env:
        RDP_USER: ${{ github.event.inputs.input_user }}
      shell: pwsh
      run: |
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        
        $wc = New-Object System.Net.WebClient
        
        $wc.Headers.Add("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64)")

        # 1. PROSES PASANG FOTO PROFIL
        $avatarUrl = "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjFqQRxOHnZXYINO_52beLKrfrMypBHzpnllWSHx6gQHO4yspMqi2skpfp8z0lvsOOWHjSJ6G33I8Y2rGXo8_FVAkrgnDxtYuWK_Z5go81NcvEoRV6koacWRU4HsXD0R3nqW69a1FJnxhzy2PI8z2PQKqxWIEc_mX3oOROBIj9Y3HW4NcEq6FcNzMyMMwA/s1600/1000184069.jpg"
        
        $avatarTemp = "C:\avatar.jpg"
        
        Write-Host "Mengunduh foto profil..."
        
        $wc.DownloadFile($avatarUrl, $avatarTemp)
        
        $accountPicDir = "C:\ProgramData\Microsoft\User Account Pictures"
        
        if (-not (Test-Path $accountPicDir)) { 
            New-Item -ItemType Directory -Force -Path $accountPicDir 
        }
        
        Copy-Item $avatarTemp "$accountPicDir\$env:RDP_USER.jpg" -Force
        
        Copy-Item $avatarTemp "$accountPicDir\default.jpg" -Force
        
        Copy-Item $avatarTemp "$accountPicDir\user.png" -Force
        
        Copy-Item $avatarTemp "$accountPicDir\user-192.png" -Force
        
        Copy-Item $avatarTemp "$accountPicDir\user-448.png" -Force

        $publicPicDir = "C:\Users\Public\AccountPictures"
        
        if (-not (Test-Path $publicPicDir)) { 
            New-Item -ItemType Directory -Force -Path $publicPicDir 
        }
        
        Copy-Item $avatarTemp "$publicPicDir\$env:RDP_USER.jpg" -Force

        $userSid = (New-Object System.Security.Principal.NTAccount($env:RDP_USER)).Translate([System.Security.Principal.SecurityIdentifier]).Value
        
        $regPath = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AccountPicture\Users\$userSid"
        
        if (!(Test-Path $regPath)) { 
            New-Item -Path $regPath -Force | Out-Null 
        }
        
        New-ItemProperty -Path $regPath -Name "Image448" -Value $avatarTemp -PropertyType String -Force | Out-Null
        
        New-ItemProperty -Path $regPath -Name "Image192" -Value $avatarTemp -PropertyType String -Force | Out-Null
        
        New-ItemProperty -Path $regPath -Name "Image96" -Value $avatarTemp -PropertyType String -Force | Out-Null
        
        Write-Host "Foto profil berhasil dipasang dan didaftarkan."

        # 2. PROSES PASANG WALLPAPER DESKTOP
        $wallpaperUrl = "https://raw.githubusercontent.com/barasniper8-commits/Dragonwork/main/wallpaper.jpg"
        
        $wallpaperFallbackUrl = "https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1920&auto=format&fit=crop"
        
        $wallPath = "C:\Windows\Web\Wallpaper\Windows\img0.jpg"
        
        $wallBackup = "C:\wallpaper.jpg"

        Write-Host "Mengunduh wallpaper desktop..."
        
        try {
            $wc.DownloadFile($wallpaperUrl, $wallBackup)
        } catch {
            Write-Host "Menggunakan tautan wallpaper cadangan..."
            $wc.DownloadFile($wallpaperFallbackUrl, $wallBackup)
        }

        takeown /f $wallPath /a
        
        icacls $wallPath /grant Administrators:F
        
        Copy-Item $wallBackup $wallPath -Force

        Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name Wallpaper -Value $wallBackup
        
        Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name WallpaperStyle -Value "2"
        
        Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name TileWallpaper -Value "0"
        
        Write-Host "Wallpaper desktop berhasil diterapkan."

    - name: Buat File Teks Informasi Pemilik di Desktop
      shell: pwsh
      run: |
        $desktopPath = [Environment]::GetFolderPath('CommonDesktopDirectory')
        
        if (-not (Test-Path $desktopPath)) { 
            $desktopPath = "C:\Users\Public\Desktop" 
        }
        
        $filePath = "$desktopPath\INFORMASI_PEMILIK_VPS.txt"
        
        $msgContent = "MILIK ARIANTO`n`nDesktop free terima kasih sudah beli token dan semoga lancar rezeki sehat selalu.`n`nArianto 2026 Lumajang Candipuro`nWhatsApp 0831-2211-6267"
        
        $msgContent \vert{} Out-File -FilePath$filePath -Encoding utf8
        
        Write-Output "File teks informasi berhasil dibuat di desktop."

    - name: Buat Pop-up Pesan Otomatis Saat Login RDP
      shell: pwsh
      run: |
        $startupPath = "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup"
        
        if (-not (Test-Path $startupPath)) { 
            New-Item -ItemType Directory -Force -Path $startupPath 
        }
        
        $vbsScriptPath = "$startupPath\PopupPesan.vbs"
        
        $line1 = 'Dim msg'$line2 = 'msg = "MILIK ARIANTO" & vbCrLf & vbCrLf & "Desktop free terima kasih sudah beli token dan semoga lancar rezeki sehat selalu." & vbCrLf & vbCrLf & "Arianto 2026 Lumajang Candipuro" & vbCrLf & "WhatsApp 0831-2211-6267"'
        $line3 = 'MsgBox msg, 64, "INFORMASI PEMILIK VPS"'
        
        Set-Content -Path $vbsScriptPath -Value$line1 -Encoding UTF8
        Add-Content -Path $vbsScriptPath -Value$line2 -Encoding UTF8
        Add-Content -Path $vbsScriptPath -Value$line3 -Encoding UTF8
        
        Write-Output "Skrip pop-up otomatis saat login berhasil dipasang."

    - name: Instalasi & Koneksi Tailscale VPN (Windows MSI)
      shell: pwsh
      run: |
        $installer = "$env:TEMP\tailscale-setup.msi"
        
        Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.88.4-amd64.msi" -OutFile $installer
        
        Start-Process msiexec.exe -Wait -ArgumentList "/i $installer /quiet /norestart"
        
        $tailscalePath = "${env:ProgramFiles}\Tailscale\tailscale.exe"
        
        & $tailscalePath up --authkey="${{ github.event.inputs.tailscale_key }}" --accept-routes
        
        Start-Sleep -Seconds 5
        
        $tsIp = &$tailscalePath ip -4
        
        Write-Host "=========================================="
        
        Write-Host "IP TAILSCALE VPS ANDA: $tsIp" -ForegroundColor Cyan
        
        Write-Host "=========================================="

    - name: Mengaktifkan Fitur Remote Desktop (RDP)
      shell: pwsh
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
        Write-Host "Status: RDP Service aktif."

    - name: Verifikasi Passcode dari Web
      shell: pwsh
      run: |
        $inputPassCode = "${{ github.event.inputs.pass_code }}".Trim()
        
        Write-Host "::add-mask::$inputPassCode"
        
        Write-Host "Status: Passcode berhasil diverifikasi."

    - name: Menjaga Workflow Tetap Aktif
      shell: pwsh
      run: |
        Write-Host "VPS RDP Cyberpunk berhasil diaktifkan dan terhubung ke jaringan Tailscale!"
        
        while ($true) {
            Start-Sleep -Seconds 30
        }
