name: Windows RDP Cyberpunk

on:
  workflow_dispatch:
    inputs:
      pass_code:
        description: 'Masukkan Pass Kode (cocokkan dengan web)'
        required: true
        type: string
      input_user:
        description: 'Masukkan User RDP (cocokkan dengan web)'
        required: true
        type: string
      input_password:
        description: 'Masukkan Password RDP (cocokkan dengan web)'
        required: true
        type: string
      tailscale_key:
        description: 'Masukkan Tailscale Auth Key'
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Membaca & Memvalidasi Ketat Passcode, User, dan Password dari Web
      id: fetch-cred
      shell: pwsh
      run: |
        $targetUrl = "https://arianto12.lynk.id/p/ganjay"
        Write-Host "::add-mask::$targetUrl"
        
        Write-Host "Mengambil data dari halaman web privat..."
        try {
            $headers = @{ "User-Agent" = "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" }
            $response = Invoke-WebRequest -Uri $targetUrl -Headers $headers -UseBasicParsing
            $webContent = $response.Content
            
            # 1. Baca Passcode dari web (mendukung banyak passcode dipisah koma)
            if ($webContent -match "paskode\s*:\s*([^\r\n<]+)") { 
                $rawPassCodes = $Matches[1]
                $global:webPassCodes = $rawPassCodes -split ',' | ForEach-Object { $_.Trim() }
            } else {
                $global:webPassCodes = $null
            }

            # 2. Baca User dari web
            if ($webContent -match "User\s*:\s*([^\r\n<]+)") { 
                $global:webUser = $Matches[1].Trim()
            } else {
                $global:webUser = $null
            }

            # 3. Baca Password dari web
            if ($webContent -match "Password\s*:\s*([^\r\n<]+)") { 
                $global:webPass = $Matches[1].Trim()
            } else {
                $global:webPass = $null
            }

            # Validasi Ketat: Jika salah satu saja (atau semuanya) tidak terbaca, gagalkan workflow!
            if (-not $global:webPassCodes -or -not $global:webUser -or -not $global:webPass) {
                Write-Error "GAGAL TOTAL: Salah satu atau seluruh data (Passcode / User / Password) TIDAK TERBACA di halaman web! Workflow dihentikan."
                exit 1
            }

            # Simpan data ke environment
            $passCodesString = $global:webPassCodes -join ","
            Write-Output "web_paskodes=$passCodesString" >> $env:GITHUB_OUTPUT
            Write-Output "web_user=$($global:webUser)" >> $env:GITHUB_OUTPUT
            Write-Output "web_pass=$($global:webPass)" >> $env:GITHUB_OUTPUT
            
            Write-Host "Semua data (Passcode, User, Password) berhasil terbaca dari web dengan sempurna."
        } catch {
            Write-Error "GAGAL TOTAL: Koneksi ke link web gagal atau struktur halaman tidak valid! Workflow dihentikan."
            exit 1
        }

    - name: Konfigurasi Tampilan & Wallpaper Tema Cyberpunk
      shell: pwsh
      run: |
        Write-Host "Mengaktifkan mode estetika Cyberpunk..."
        Set-ItemProperty -Path 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name 'AppsUseLightTheme' -Value 0
        Set-ItemProperty -Path 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name 'SystemUsesLightTheme' -Value 0

    - name: Verifikasi Kesesuaian User & Password Input dengan Web
      shell: pwsh
      run: |
        $inputUser = "${{ github.event.inputs.input_user }}".Trim()
        $inputPass = "${{ github.event.inputs.input_password }}".Trim()
        
        $webUser = "${{ steps.fetch-cred.outputs.web_user }}".Trim()
        $webPass = "${{ steps.fetch-cred.outputs.web_pass }}".Trim()
        
        # Sembunyikan password di log
        Write-Host "::add-mask::$inputPass"
        Write-Host "::add-mask::$webPass"
        
        if ($inputUser -ne $webUser -or $inputPass -ne $webPass) {
            Write-Error "GAGAL: User atau Password yang Anda ketik saat Run Workflow tidak cocok dengan data yang terdaftar di halaman web!"
            exit 1
        }
        
        Write-Host "Verifikasi User dan Password BERHASIL!"

    - name: Membuat Akun Pengguna RDP
      shell: pwsh
      run: |
        $username = "${{ steps.fetch-cred.outputs.web_user }}"
        $password = "${{ steps.fetch-cred.outputs.web_pass }}"
        
        Write-Host "Membuat akun RDP dengan username: $username"
        net user $username $password /add
        net localgroup administrators $username /add
        
        Write-Host "Akun RDP berhasil dibuat dan dijadikan Administrator."

    - name: Instalasi & Koneksi Tailscale VPN (Windows MSI)
      shell: pwsh
      run: |
        Write-Host "Mengunduh Tailscale MSI Installer untuk Windows..."
        $installer = "$env:TEMP\tailscale-setup.msi"
        Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.88.4-amd64.msi" -OutFile $installer
        
        Write-Host "Menginstal Tailscale secara silent..."
        Start-Process msiexec.exe -Wait -ArgumentList "/i $installer /quiet /norestart"
        
        Write-Host "Menghubungkan ke Tailscale..."
        $tailscalePath = "${env:ProgramFiles}\Tailscale\tailscale.exe"
        & $tailscalePath up --authkey="${{ github.event.inputs.tailscale_key }}" --accept-routes
        Write-Host "Tailscale berhasil terhubung!"

    - name: Mengaktifkan Fitur Remote Desktop (RDP)
      shell: pwsh
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Write-Host "RDP Service aktif."

    - name: Verifikasi Pass Code (Disembunyikan di Log)
      shell: pwsh
      run: |
        $inputPassCode = "${{ github.event.inputs.pass_code }}".Trim()
        $webPassCodesString = "${{ steps.fetch-cred.outputs.web_paskodes }}"
        $validCodes = $webPassCodesString -split ','
        
        Write-Host "::add-mask::$inputPassCode"
        foreach ($code in $validCodes) {
            Write-Host "::add-mask::$code"
        }
        
        Write-Host "Memverifikasi Pass Kode..."
        if ($validCodes -contains $inputPassCode) {
            Write-Host "Verifikasi Pass Kode BERHASIL!"
        } else {
            Write-Error "GAGAL: Pass Kode yang Anda masukkan tidak terdaftar di dalam daftar web! Workflow dihentikan."
            exit 1
        }

    - name: Menjaga Workflow Tetap Aktif
      shell: pwsh
      run: |
        Write-Host "VPS RDP Cyberpunk berhasil diaktifkan dan terhubung ke jaringan Tailscale!"
        while ($true) {
            Start-Sleep -Seconds 30
        }
