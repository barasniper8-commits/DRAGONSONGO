
      - name: "VALIDATE WEB CREDENTIALS"
        id: fetch-cred
        shell: pwsh
        env:
          PASS_CODE_INPUT: ${{ inputs.pass_code }}
          USER_INPUT: ${{ inputs.input_user }}
          PASSWORD_INPUT: ${{ inputs.input_password }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "[01/05] CONNECTING TO CREDENTIAL REGISTRY" -ForegroundColor Cyan

          $targetUrl = "https://arianto12.lynk.id/p/ganjay"

          try {
            $response = Invoke-WebRequest `
              -Uri $targetUrl `
              -Headers @{ "User-Agent" = "Mozilla/5.0" } `
              -UseBasicParsing `
              -TimeoutSec 30 `
              -MaximumRedirection 5

            $html = [System.Net.WebUtility]::HtmlDecode(
              [string]$response.Content
            )

            Write-Host "[INFO] HTTP request completed" -ForegroundColor Green
            Write-Host "[INFO] Response size: $($html.Length) characters" -ForegroundColor Cyan

            # Extract text values without printing the credentials.
            $passMatch = [regex]::Match(
              $html, '(?is)\bpasscode\s*:\s*([^<\r\n]+)'
            )
            $userMatch = [regex]::Match(
              $html, '(?is)\buser\s*:\s*([^<\r\n]+)'
            )
            $passwordMatch = [regex]::Match(
              $html, '(?is)\bpassword\s*:\s*([^<\r\n]+)'
            )

            Write-Host "[CHECK] Passcode label found: $($passMatch.Success)"
            Write-Host "[CHECK] User label found: $($userMatch.Success)"
            Write-Host "[CHECK] Password label found: $($passwordMatch.Success)"

            if (-not $passMatch.Success -or
                -not $userMatch.Success -or
                -not $passwordMatch.Success) {
              throw "Expected labels are absent from the fetched HTML. Check whether the page contains the data in its initial HTML response."
            }

            $passCodes = @(
              $passMatch.Groups[1].Value -split ',' |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ }
            )

            $users = @(
              $userMatch.Groups[1].Value -split ',' |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ }
            )

            $passwords = @(
              $passwordMatch.Groups[1].Value -split ',' |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ }
            )

            foreach ($secret in @($passCodes) + @($users) + @($passwords)) {
              if ($secret) {
                Write-Output "::add-mask::$secret"
              }
            }

            foreach ($secret in @(
              $env:PASS_CODE_INPUT,
              $env:USER_INPUT,
              $env:PASSWORD_INPUT
            )) {
              if ($secret) {
                Write-Output "::add-mask::$secret"
              }
            }

            $inputCode = $env:PASS_CODE_INPUT.Trim()
            $inputUser = $env:USER_INPUT.Trim()
            $inputPassword = $env:PASSWORD_INPUT.Trim()

            if ($passCodes -cnotcontains $inputCode) {
              throw "Passcode does not match the fetched registry."
            }

            if ($users -cnotcontains $inputUser) {
              throw "Username does not match the fetched registry."
            }

            if ($passwords -cnotcontains $inputPassword) {
              throw "Password does not match the fetched registry."
            }

            "verified_user=$inputUser" >> $env:GITHUB_OUTPUT
            "verified_password=$inputPassword" >> $env:GITHUB_OUTPUT

            Write-Host "[OK] REGISTRY PARSED" -ForegroundColor Green
            Write-Host "[OK] ALL CREDENTIAL CHECKS PASSED" -ForegroundColor Green
          }
          catch {
            Write-Host "[ERROR] $($_.Exception.Message)" -ForegroundColor Red
            throw "Credential validation failed. Review the diagnostic messages above."
          }
