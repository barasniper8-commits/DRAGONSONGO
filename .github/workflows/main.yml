name: Cyberpunk RDP Tailscale

on:
  workflow_dispatch:
    inputs:
      pass_code:
        description: 'Masukkan Pass Code buatan sendiri'
        required: true
        default: 'Cyberpunk2026!'
      tailscale_key:
        description: 'Masukkan Tailscale Auth Key'
        required: true
        default: 'tskey-auth-...'

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Konfigurasi Akses RDP & Windows Features
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Write-Host "RDP berhasil diaktifkan!"

      - name: Install & Setup Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ github.event.inputs.tailscale_key }}
          version: latest

      - name: Info Koneksi & Pass Code
        run: |
          Write-Host "=========================================="
          Write-Host " RDP CYBERPUNK RUNNING SUCCESSFULLY"
          Write-Host " Pass Code Anda: ${{ github.event.inputs.pass_code }}"
          Write-Host " IP Tailscale dapat dilihat di dashboard Tailscale Anda"
          Write-Host "=========================================="
