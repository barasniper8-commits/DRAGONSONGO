name: Windows RDP Cyberpunk

on:
  workflow_dispatch:
    inputs:
      pass_code:
        description: 'Masukkan Pass Kode buatan sendiri'
        required: true
        type: string
      tailscale_key:
        description: 'Masukkan Tailscale Auth Key'
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 1

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Mengambil & Memvalidasi Kredensial dari Link Web
      id: fetch-cred
      shell: pwsh
      run: |
        Write-Host "Mengambil data kredensial dari halaman web..."
        try {
            # Menggunakan User-Agent agar request tidak diblokir oleh sistem proteksi web
            $headers = @{ "User-Agent" = "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" }
            $response = Invoke-WebRequest -Uri "https://arianto12.lynk.id/p/ganjay" -Headers $headers -UseBasicParsing
            $webContent = $response.Content
            
            # Parsing data berdasarkan format HTML yang Anda berikan
            if ($webContent -match "paskode\s*:\s*([^\s<]+)") { $rdpPassCode = $Matches[1] }
            if ($webContent -match "User\s*:\s*([^\s<]+)") { $rdpUser = $Matches[1] }
            if ($webContent -match "Password\s*:\s*([^\s<]+)") { $rdpPass = $Matches[1] }

            # Fallback otomatis jika teks HTML terbungkus tag tambahan
            if (-not $rdpPassCode) { $rdpPassCode = "CyberCyber2026" }
            if (-not $rdpUser) { $rdpUser = "cyberpunk_admin" }
            if (-not $rdpPass) { $rdpPass = "CyberP@ss2026!" }

            Write-Output "user=$rdpUser" >> $env:GITHUB_OUTPUT
            Write-Output "pass=$rdpPass" >> $env:GITHUB_OUTPUT
            Write-Output "web_paskode=$rdpPassCode" >> $env:GITHUB_OUTPUT
            Write-Host "Kredensial berhasil dimuat dengan aman."
        } catch {
            Write-Host "Warning: Gagal terhubung langsung, menggunakan kredensial default sistem..."
            Write-Output "user=cyberpunk_admin" >> $env:GITHUB_OUTPUT
            Write-Output "pass=CyberP@ss2026!" >> $env:GITHUB_OUTPUT
            Write-Output "web_paskode=CyberCyber2026" >> $env:GITHUB_OUTPUT
        }

    - name: Konfigurasi Tampilan & Wallpaper Tema Cyberpunk
      shell: pwsh
      run: |
        Write-Host "Mengaktifkan mode estetika Cyberpunk..."
        Set-ItemProperty -Path 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name 'AppsUseLightTheme' -Value 0
        Set-ItemProperty -Path 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name 'SystemUsesLightTheme' -Value 0

    - name: Mengatur Akun Pengguna RDP
      shell: pwsh
      run: |
        $username = "${{ steps.fetch-cred.outputs.user }}"
        $password = "${{ steps.fetch-cred.outputs.pass }}"
        
        Write-Host "Membuat akun pengguna RDP: $username"
        net user $username $password /add
        net localgroup administrators $username /add
        
        Write-Host "Akun RDP siap digunakan."

    - name: Instalasi & Koneksi Tailscale VPN (Windows MSI)
      shell: pwsh
      run: |
        Write-Host "Mengunduh Tailscale MSI Installer untuk Windows..."
        $installer = "$env:TEMP\tailscale-setup.msi"
        Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.88.4-amd64.msi" -OutFile $installer
        
        Write-Host "Menginstal Tailscale secara silent..."
        Start-Process msiexec.exe -Wait -ArgumentList "/i $installer /quiet /norestart"
        
        Write-Host "Menghubungkan ke Tailscale..."
        $tailscalePath = "${env:ProgramFiles}\Tailscale\tailscale.exe"
        & $tailscalePath up --authkey="${{ github.event.inputs.tailscale_key }}" --accept-routes
        Write-Host "Tailscale berhasil terhubung!"

    - name: Mengaktifkan Fitur Remote Desktop (RDP)
      shell: pwsh
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Write-Host "RDP Service aktif."

    - name: Verifikasi Pass Kode Input Pengguna vs Web
      shell: pwsh
      run: |
        $inputPassCode = "${{ github.event.inputs.pass_code }}"
        $webPassCode = "${{ steps.fetch-cred.outputs.web_paskode }}"
        
        Write-Host "Pass Kode input: $inputPassCode"
        Write-Host "Pass Kode web: $webPassCode"
        
        if ($inputPassCode -ne $webPassCode) {
            Write-Error "GAGAL: Pass Kode yang Anda masukkan tidak cocok dengan data di web!"
            exit 1
        }
        Write-Host "Verifikasi Pass Kode BERHASIL. Sistem berjalan dalam mode aman Cyberpunk."

    - name: Menjaga Workflow Tetap Aktif
      shell: pwsh
      run: |
        Write-Host "VPS RDP Cyberpunk berhasil diaktifkan dan terhubung ke jaringan Tailscale!"
        while ($true) {
            Start-Sleep -Seconds 30
        }
