name: ThyoCloud Personal RDP (Fork)

on:
  workflow_dispatch:
    inputs:
      osChoice:
        description: 'Pilih Versi Windows Server'
        required: true
        type: choice
        default: 'windows-2022'
        options:
          - windows-latest
          - windows-2025
          - windows-2022
      userEmail:
        description: 'Email yang terdaftar di Web ThyoCloud'
        required: true
      customUsername:
        description: 'Username RDP (Opsional - Default: thyocloud)'
        required: false
        default: 'thyocloud'

jobs:
  build-rdp:
    runs-on: ${{ github.event.inputs.osChoice }}
    timeout-minutes: 360

    steps:
      - name: 🚀 Menghubungkan ke ThyoCloud Server Web
        env:
          EMAIL: ${{ github.event.inputs.userEmail }}
          RDP_USER: ${{ github.event.inputs.customUsername }}
          REPO: ${{ github.event.repository.name }}
          OS_TYPE: ${{ github.event.inputs.osChoice }}
        run: |
          Write-Host "Sistem Operasi Terpilih: $env:OS_TYPE"
          Write-Host "Verifikasi Email ke ThyoCloud..."
          
          $webUrl = "https://thyo.cloud/api/get-core"
          
          # Payload JSON
          $payload = @{ email = $env:EMAIL; username =$env:RDP_USER; repo = $env:REPO } \vert{} ConvertTo-Json$requestParams = @{
            Uri         = $webUrl
            Method      = 'Post'
            Body        = $payload
            ContentType = 'application/json'
          }
          
          try {
            $req = Invoke-RestMethod @requestParams
            
            if ($req.success -eq$true) {
              Write-Host "✅ Akses Diterima! Menjalankan Core Engine..."
              Invoke-Expression $req.script

              # --- KODE TAMBAHAN: KONFIGURASI USER & RDP GROUP ---
              try {
                  Write-Host "Memeriksa dan mengonfigurasi akses User Windows..."
                  $targetUser = "$env:RDP_USER"
                  
                  # Memasukkan user ke grup Remote Desktop Users agar diizinkan koneksi RDP
                  net localgroup "Remote Desktop Users" $targetUser /add 2>&1
                  # Memastikan akun aktif
                  net user $targetUser /active:yes 2>&1
                  
                  Write-Host "✅ Akses User RDP berhasil dikonfigurasi!"
              } catch {
                  Write-Host "⚠️ Catatan User: $_"
              }
              # --------------------------------------------------

              # --- KODE GANTI WALLPAPER ---
              try {
                  Write-Host "Mencoba mengatur wallpaper desktop..."
                  $imageUrl = "https://raw.githubusercontent.com/username/repo/main/wallpaper.jpg" # Ganti link gambar (.jpg/.png)
                  $outputFile = "$env:TEMP\custom_wallpaper.jpg"
                  
                  Invoke-WebRequest -Uri $imageUrl -OutFile $outputFile$cSource = "using System.Runtime.InteropServices; public class WallpaperSetter { [DllImport(`"user32.dll`", CharSet = CharSet.Auto)] public static extern int SystemParametersInfo(int uAction, int uParam, string lpvParam, int fuWinIni); }"
                  Add-Type -TypeDefinition $cSource
                  [WallpaperSetter]::SystemParametersInfo(20, 0, $outputFile, 3)
                  Write-Host "✅ Wallpaper berhasil diubah!"
              } catch {
                  Write-Host "⚠️ Peringatan: Gagal mengubah wallpaper, proses RDP dilanjutkan."
              }
              # ---------------------------

            } else {
              Write-Host "⛔ GAGAL: $($req.message)"
              Write-Host "Pastikan kamu sudah klaim Token di Web dan Verify di Bot Telegram @ThyoCloudBot"
              exit 1
            }
          } catch {
            Write-Host "⛔ Detail Error: $_"
            Write-Host "Pastikan email sudah terdaftar, token sudah diklaim di web, dan terverifikasi di @ThyoCloudBot"
            exit 1
          }
