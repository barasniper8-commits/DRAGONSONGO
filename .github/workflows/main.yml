name: Windows RDP Cyberpunk

on:
  workflow_dispatch:
    inputs:
      pass_code:
        description: 'Masukkan Pass Kode (salah satu dari web)'
        required: true
        type: string
      input_user:
        description: 'Masukkan Username RDP (salah satu dari web)'
        required: true
        type: string
      input_password:
        description: 'Masukkan Password RDP (sesuai user)'
        required: true
        type: string
      tailscale_key:
        description: 'Masukkan Tailscale Auth Key'
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Membaca & Memvalidasi Ketat (Passcode, User, Password) dari Web
      id: fetch-cred
      shell: pwsh
      run: |
        $u1 = "https://arianto1"
        $u2 = "2.lynk.id/p/ganjay"
        $targetUrl = "$u1$u2"
        
        [Console]::WriteLine("::add-mask::$targetUrl")
        
        try {
            $headers = @{ "User-Agent" = "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" }
            $response = Invoke-WebRequest -Uri $targetUrl -Headers $headers -UseBasicParsing
            $webContent = $response.Content
            
            if ($webContent -match "passcode\s*:\s*([^\r\n<]+)") { 
                $rawPassCodes = $Matches[1]
                $global:validPassCodes = $rawPassCodes -split ',' | ForEach-Object { $_.Trim() }
            } else {
                $global:validPassCodes = @()
            }

            if ($webContent -match "user\s*:\s*([^\r\n<]+)") { 
                $rawUsers = $Matches[1]
                $global:validUsers = $rawUsers -split ',' | ForEach-Object { $_.Trim() }
            } else {
                $global:validUsers = @()
            }

            if ($webContent -match "password\s*:\s*([^\r\n<]+)") { 
                $rawPasswords = $Matches[1]
                $global:validPasswords = $rawPasswords -split ',' | ForEach-Object { $_.Trim() }
            } else {
                $global:validPasswords = @()
            }

            if ($global:validPassCodes.Count -eq 0 -or $global:validUsers.Count -eq 0 -or $global:validPasswords.Count -eq 0) {
                Write-Error "GAGAL TOTAL: Data tidak terbaca di halaman web!"
                exit 1
            }

            Write-Output "web_paskodes=$($global:validPassCodes -join ',')" >> $env:GITHUB_OUTPUT
            Write-Output "web_users=$($global:validUsers -join ',')" >> $env:GITHUB_OUTPUT
            Write-Output "web_passwords=$($global:validPasswords -join ',')" >> $env:GITHUB_OUTPUT
            
            Write-Host "Status: Semua data berhasil divalidasi dari web."
        } catch {
            Write-Error "GAGAL TOTAL: Terhubung ke halaman web gagal!"
            exit 1
        }

    - name: Konfigurasi Tampilan & Pemasangan Wallpaper Windows
      shell: pwsh
      run: |
        Set-ItemProperty -Path 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name 'AppsUseLightTheme' -Value 0
        Set-ItemProperty -Path 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name 'SystemUsesLightTheme' -Value 0

        Write-Host "Mengunduh dan menerapkan Wallpaper Windows..."
        $wallPath = "C:\Users\runneradmin\AppData\Local\Temp\cyber_wallpaper.jpg"
        
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        $webClient = New-Object System.Net.WebClient
        $webClient.Headers.Add("User-Agent", "Mozilla/5.0")
        
        # Menggunakan mirror link gambar langsung agar sukses 100%
        $webClient.DownloadFile("https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=1920&auto=format&fit=crop", $wallPath)
        
        Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name Wallpaper -Value $wallPath
        rundll32.exe user32.dll, UpdatePerUserSystemParameters
        Write-Host "Wallpaper berhasil diterapkan."

    - name: Verifikasi, Pembuatan Akun RDP & Foto Profil
      shell: pwsh
      run: |
        $inputUser = "${{ github.event.inputs.input_user }}".Trim()
        $inputPass = "${{ github.event.inputs.input_password }}".Trim()
        
        $webUsersString = "${{ steps.fetch-cred.outputs.web_users }}"
        $webPassString = "${{ steps.fetch-cred.outputs.web_passwords }}"
        
        $validUsers = $webUsersString -split ','
        $validPasswords = $webPassString -split ','
        
        Write-Host "::add-mask::$inputPass"
        foreach ($p in $validPasswords) { Write-Host "::add-mask::$p" }
        
        if (-not ($validUsers -contains $inputUser)) {
            Write-Error "GAGAL: Username tidak terdaftar!"
            exit 1
        }
        
        if (-not ($validPasswords -contains $inputPass)) {
            Write-Error "GAGAL: Password tidak valid!"
            exit 1
        }

        net user $inputUser $inputPass /add
        net localgroup administrators $inputUser /add
        Write-Host "Status: Akun RDP berhasil dibuat."

        # Mengatur Foto Profil Windows
        Write-Host "Mengatur foto profil Windows..."
        $avatarPath = "$env:TEMP\cyber_avatar.jpg"
        
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        $webClient = New-Object System.Net.WebClient
        $webClient.Headers.Add("User-Agent", "Mozilla/5.0")
        $webClient.DownloadFile("https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhmN4r8QQGWBuwdrDIE14cm92glQ6NGb20JY9-3fQ-fqBA4tMU5jCnqT-IGypusofrW6mHYJ4_SfTl0mehMAwKf1hI_rbDz_XUxRLfhQG0wZ_Zutv14soi931Rx1tR6bRafIaCp0oGpTc2dYShTbHJWHKbKrosZRMUwHG5i0wl25-f3B4wNZPT1nkdRdO0/s1600/1000184069.jpg", $avatarPath)
        
        $accountPicDir = "C:\ProgramData\Microsoft\User Account Pictures"
        if (-not (Test-Path $accountPicDir)) { New-Item -ItemType Directory -Force -Path $accountPicDir }
        
        Copy-Item $avatarPath "$accountPicDir\$inputUser.jpg" -Force
        Copy-Item $avatarPath "$accountPicDir\default.jpg" -Force
        Write-Host "Foto profil berhasil diterapkan."

    - name: Instalasi & Koneksi Tailscale VPN (Windows MSI)
      shell: pwsh
      run: |
        $installer = "$env:TEMP\tailscale-setup.msi"
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        (New-Object System.Net.WebClient).DownloadFile("https://pkgs.tailscale.com/stable/tailscale-setup-1.88.4-amd64.msi", $installer)
        
        Start-Process msiexec.exe -Wait -ArgumentList "/i $installer /quiet /norestart"
        
        $tailscalePath = "${env:ProgramFiles}\Tailscale\tailscale.exe"
        & $tailscalePath up --authkey="${{ github.event.inputs.tailscale_key }}" --accept-routes
        
        Start-Sleep -Seconds 5
        $tsIp = & $tailscalePath ip -4
        Write-Host "=========================================="
        Write-Host "IP TAILSCALE VPS ANDA: $tsIp" -ForegroundColor Cyan
        Write-Host "=========================================="

    - name: Mengaktifkan Fitur Remote Desktop (RDP)
      shell: pwsh
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Write-Host "Status: RDP Service aktif."

    - name: Verifikasi Passcode (Disembunyikan di Log)
      shell: pwsh
      run: |
        $inputPassCode = "${{ github.event.inputs.pass_code }}".Trim()
        $webPassCodesString = "${{ steps.fetch-cred.outputs.web_paskodes }}"
        $validCodes = $webPassCodesString -split ','
        
        Write-Host "::add-mask::$inputPassCode"
        foreach ($code in $validCodes) {
            Write-Host "::add-mask::$code"
        }
        
        if ($validCodes -contains $inputPassCode) {
            Write-Host "Status: Verifikasi Passcode BERHASIL."
        } else {
            Write-Error "GAGAL: Passcode tidak terdaftar!"
            exit 1
        }

    - name: Menjaga Workflow Tetap Aktif
      shell: pwsh
      run: |
        Write-Host "VPS RDP Cyberpunk berhasil diaktifkan dan terhubung ke jaringan Tailscale!"
        while ($true) {
            Start-Sleep -Seconds 30
        }
